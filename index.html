    <script>
      (function() {
        if (typeof window === 'undefined') return;
        // 1. Suppress console error noise for benign Vite WebSocket HMR closure in proxy environments
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) {
            return (a && (a.message || a.stack)) ? (a.message + ' ' + (a.stack || '')) : String(a);
          }).join(' ');
          if (
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            msg.indexOf('[vite] server connection lost') !== -1 ||
            (msg.indexOf('[vite]') !== -1 && msg.indexOf('WebSocket') !== -1)
          ) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        // 2. Prevent window unhandled error popups for @vite/client WebSocket events
        window.addEventListener('error', function(e) {
          var isViteWs = (e && e.message && e.message.indexOf('WebSocket closed without opened') !== -1) ||
                         (e && e.filename && e.filename.indexOf('@vite/client') !== -1);
          if (isViteWs) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);

        // 3. Gracefully handle vite-hmr WebSocket client requests
        var NativeWS = window.WebSocket;
        if (NativeWS) {
          window.WebSocket = function(url, protocols) {
            var isViteHmr = (Array.isArray(protocols) ? protocols.indexOf('vite-hmr') !== -1 : protocols === 'vite-hmr') ||
                            (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite/client') !== -1));
            if (isViteHmr) {
              var target = new EventTarget();
              var mockSocket = {
                readyState: 1, // OPEN
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                url: String(url),
                binaryType: 'blob',
                send: function() {},
                close: function() {},
                addEventListener: target.addEventListener.bind(target),
                removeEventListener: target.removeEventListener.bind(target),
                dispatchEvent: target.dispatchEvent.bind(target),
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null
              };
              try {
                Object.setPrototypeOf(mockSocket, NativeWS.prototype);
              } catch (_) {}
              setTimeout(function() {
                var openEvt = new Event('open');
                if (typeof mockSocket.onopen === 'function') {
                  mockSocket.onopen(openEvt);
                }
                mockSocket.dispatchEvent(openEvt);
              }, 0);
              return mockSocket;
            }
            return new NativeWS(url, protocols);
          };
          window.WebSocket.prototype = NativeWS.prototype;
          window.WebSocket.CONNECTING = NativeWS.CONNECTING;
          window.WebSocket.OPEN = NativeWS.OPEN;
          window.WebSocket.CLOSING = NativeWS.CLOSING;
          window.WebSocket.CLOSED = NativeWS.CLOSED;
        }
      })();
    </script>
